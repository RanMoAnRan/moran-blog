<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#c026d3">
    <title>文章管理 · 墨然</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        color: #3b1d3f;
        background:
          radial-gradient(circle at 20% 20%, rgb(192 38 211 / 12%), transparent 34rem),
          #faf7fb;
        font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .admin-loading {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: grid;
        box-sizing: border-box;
        place-content: center;
        max-width: 28rem;
        margin: auto;
        padding: 2rem;
        text-align: center;
      }

      .admin-loading__mark {
        display: grid;
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        place-items: center;
        border-radius: 1rem;
        color: white;
        background: #c026d3;
        box-shadow: 0 12px 32px rgb(192 38 211 / 24%);
        font: 700 1.4rem/1 Georgia, serif;
      }

      .admin-loading h1 {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
      }

      .admin-loading p {
        margin: 0;
        color: #765a78;
      }
    </style>
  </head>
  <body>
    <main class="admin-loading" aria-live="polite">
      <div class="admin-loading__mark" aria-hidden="true">墨</div>
      <h1>正在加载文章管理后台</h1>
      <p>首次打开需要从 CDN 下载编辑器，请稍候。</p>
      <noscript><p>此后台需要启用 JavaScript。</p></noscript>
    </main>
    <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>
    <script>
      const dismissLoading = () => {
        if (!document.querySelector('#nc-root')) return;
        document.querySelector('.admin-loading')?.remove();
        return true;
      };
      const observer = new MutationObserver(() => {
        if (!dismissLoading()) return;
        observer.disconnect();
      });
      if (!dismissLoading()) observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
