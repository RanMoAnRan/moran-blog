{{- $posts := where site.RegularPages "Section" "posts" -}}
{{- $postCount := len $posts -}}
{{- $groups := sort ($posts.GroupByDate "2006") "Key" "desc" -}}

<section class="rail-card rail-archive-capsule" aria-label="时光漫游">
  <div class="rail-card__head">
    <div class="rail-capsule-badge">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
      <span>CAPSULE</span>
    </div>
  </div>

  <div class="rail-capsule-body">
    <h2 class="rail-capsule-title">时光漫游</h2>
    <p class="rail-capsule-desc">穿梭时间轴，偶遇过去记下的想法与灵光。</p>

    <div class="rail-capsule-insights">
      <div class="rail-capsule-insight">
        <span class="rail-capsule-insight__label">跨越年度</span>
        <strong class="rail-capsule-insight__val">{{ len $groups }} 年</strong>
      </div>
      <div class="rail-capsule-insight">
        <span class="rail-capsule-insight__label">总收录篇目</span>
        <strong class="rail-capsule-insight__val">{{ $postCount }} 篇</strong>
      </div>
    </div>

    <button type="button" class="rail-capsule-action-btn" data-action="random-archive">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      <span>随机漫游一篇</span>
    </button>
  </div>
</section>
