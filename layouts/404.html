{{ define "main" }}
  <div class="container">
    <div class="not-found">
      <div class="not-found-card">
        <div class="not-found-code">404</div>
        <h1 class="not-found-title">页面走丢了</h1>
        <p class="not-found-desc">你访问的地址不存在，可能已被移动或删除。</p>

        <form class="not-found-search" action="{{ "search" | relURL }}" method="get" role="search">
          <label class="sr-only" for="not-found-input">搜索文章</label>
          <input
            id="not-found-input"
            class="not-found-input"
            type="search"
            name="q"
            inputmode="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="试试搜索你想看的内容…"
          >
          <button class="btn btn-primary" type="submit">搜索</button>
        </form>

        <div class="not-found-actions">
          <a class="btn btn-outline" href="{{ site.Home.RelPermalink }}">返回首页</a>
          <a class="btn btn-outline" href="{{ "archives" | relURL }}">查看归档</a>
          <a class="btn btn-outline" href="{{ "tags" | relURL }}">浏览标签</a>
        </div>
      </div>
    </div>
  </div>

  <style>
    .not-found {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 0 80px;
    }

    .not-found-card {
      position: relative;
      overflow: hidden;
      width: min(880px, 100%);
      text-align: center;
      padding: 48px 40px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background:
        radial-gradient(420px 180px at 50% 0%, rgba(99, 102, 241, 0.14), transparent 72%),
        color-mix(in srgb, var(--panel) 84%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 22px 54px -30px rgba(15, 23, 42, 0.28), var(--shadow-sm);
      display: grid;
      gap: 16px;
    }

    .not-found-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #8b5cf6, #0ea5e9 52%, #10b981);
    }

    .not-found-code {
      font-size: clamp(3.4rem, 8.5vw, 5.4rem);
      font-weight: 950;
      letter-spacing: -0.06em;
      line-height: 1;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .not-found-title {
      margin: 0;
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      color: var(--text-heading);
    }

    .not-found-desc {
      margin: 0;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .not-found-search {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .not-found-input {
      flex: 1 1 240px;
      min-width: 220px;
      max-width: 360px;
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 10px 16px;
      background: var(--panel-muted);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .not-found-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.16);
    }

    .not-found-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    [data-theme='dark'] .not-found-input {
      background: rgba(15, 23, 42, 0.5);
    }
  </style>
{{ end }}
